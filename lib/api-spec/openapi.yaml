openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quotes
    description: Quote inquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quotes:
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Submit a quote inquiry
      description: Validates and stores an inquiry for the sales team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Inquiry stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteCreated"
        "400":
          description: Invalid inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Inquiry could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuoteInput:
      type: object
      additionalProperties: false
      properties:
        locale:
          type: string
          enum: [en, zh]
        name:
          type: string
          minLength: 1
          maxLength: 120
        company:
          type: string
          maxLength: 160
        country:
          type: string
          minLength: 2
          maxLength: 2
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        inquiryType:
          type: string
          enum: [vehicle-quote, showroom-partner, other]
        vehicles:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 120
        quantity:
          type: string
          enum: ["1", "2-5", "6-20", "20+"]
        destination:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 2000
        consent:
          type: boolean
          const: true
        hp:
          type: string
          maxLength: 0
      required:
        - locale
        - name
        - country
        - inquiryType
        - vehicles
        - consent
        - hp
    QuoteCreated:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, createdAt]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

