services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hag
      POSTGRES_PASSWORD: hag
      POSTGRES_DB: hag
    ports:
      - "5432:5432"
    volumes:
      - hag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hag -d hag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hag_pgdata:
